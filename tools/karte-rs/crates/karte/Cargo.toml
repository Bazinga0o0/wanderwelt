[package]
name = "karte"
description = "wanderwelt-karte: Kommandozeile für Karten aus Minecraft-Welten"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mc-nbt.workspace = true
mc-region.workspace = true
mc-assets.workspace = true
mc-tiles.workspace = true
rayon.workspace = true
image-webp = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
webp = { workspace = true, optional = true }
png = { workspace = true, optional = true }
sha2.workspace = true
serde_json.workspace = true

[features]
# Standard: auch die Untersuchungs- und Messbefehle der Probe (Codec-Vergleiche
# mit zstd/WebP, brauchen einen C-Compiler). Für Betrieb und Release ohne:
# `cargo build --release --no-default-features` (reines Rust, statisch linkbar).
default = ["untersuchung"]
untersuchung = ["dep:image-webp", "dep:zstd", "dep:webp", "dep:png"]

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
