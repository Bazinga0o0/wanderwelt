[workspace]
resolver = "3"
members = [
    "crates/mc-nbt",
    "crates/mc-region",
    "crates/mc-assets",
    "crates/mc-tiles",
    
    
    "crates/karte",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.dependencies]
mc-nbt = { path = "crates/mc-nbt" }
mc-region = { path = "crates/mc-region" }
mc-assets = { path = "crates/mc-assets" }
mc-tiles = { path = "crates/mc-tiles" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }
png = "0.17"
image-webp = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sha2 = "0.10"
zstd = "0.13"
webp = { version = "0.3", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
codegen-units = 4
lto = "thin"
