// Server-Mod für wanderwelt: Chatverlauf im Weltordner, Wiedergabe beim Beitritt.
// Bauen: JDK 25, dann `gradlew build` → build/libs/wanderwelt-chatverlauf-26.2-<version>.jar
// Minecraft 26.x ist nicht mehr verschleiert: Loom ohne Mappings, Mojang-Namen.
plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = '1.1.0'
group = 'de.wanderwelt'

base {
	archivesName = 'wanderwelt-chatverlauf-26.2'
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

dependencies {
	minecraft 'com.mojang:minecraft:26.2'
	implementation 'net.fabricmc:fabric-loader:0.20.1'
	implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

loom {
	serverOnlyMinecraftJar()
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

def modVersion = project.version.toString()
processResources {
	inputs.property 'version', modVersion
	filesMatching('fabric.mod.json') { expand version: modVersion }
}
